[project]
name = "chipagent"
version = "0.2.0"
description = "ChipAgent — EDA tool MCP service layer for LLM-assisted chip design validation"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    "openai>=1.0.0",
    "temporalio>=1.20.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chipagent*"]

[tool.setuptools.package-data]
"chipagent.skills" = ["text/**/*"]

[project.scripts]
chipagent = "chipagent.workflow:main"
chipagent-cli = "chipagent.interaction:main"
chipagent-mcp = "chipagent.mcp:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
